<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Encontrar Meu Pet</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Encontrar Meu Pet 🐾</h1>

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
            >

            <label>Tipo de moradia</label>

            <select id="tipoCasa">
                <option value="apartamento">Apartamento</option>
                <option value="casa">Casa</option>
            </select>

            <label>Deseja adotar:</label>

            <select id="tipoPet">
                <option value="gato">Gato</option>
                <option value="cachorro">Cachorro</option>
            </select>

            <div class="checkbox-group">

                <label class="checkbox">
                    <input type="checkbox" id="telado">
                    Ambiente telado
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="criancas">
                    Possui crianças
                </label>

            </div>

            <button onclick="buscarPet()">
                Encontrar Pet Ideal
            </button>

        </div>

        <div id="resultado"></div>

    </div>

    <script src="js/match.js"></script>

</body>
</html>
